[package]
name = "modelrouter"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94.1"

[[bin]]
name = "modelrouter"
path = "src/main.rs"

[lib]
name = "modelrouter"
path = "src/lib.rs"

[features]
# Operator direction (2026-08-20): build with every provider compiled in by
# default — an unconfigured provider costs nothing at runtime, while a binary
# missing a compiled feature refuses to start against a config that names it
# (the fail-loud guard in main), which turns a plain `cargo build` into a trap.
default = ["vertex", "bedrock", "bing-grounding", "foundry"]
postgres = ["sqlx/postgres"]
prometheus = ["dep:prometheus"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-config"]
vertex = ["dep:google-cloud-auth"]
# Grounding with Bing Search on Azure AI Foundry. No optional dependencies: the
# Entra token flow is a form POST over the reqwest client that is already here,
# which is cheaper than adding the azure_identity/azure_core dependency tree.
bing-grounding = []
# Model inference against Azure AI Foundry deployments (chat, streaming,
# embeddings, catalog). Shares the Entra token source with bing-grounding, so
# likewise no optional dependencies.
foundry = []
s3-archival = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
]

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
# sqlx 0.9: the runtime and TLS features are separate (the 0.8 combination
# feature `runtime-tokio-native-tls` no longer exists), and the SQLite surface
# is opt-in per API: `sqlite-bundled` compiles the bundled C library (the
# libsqlite3-sys range 0.9 selects, 0.39+, carries the 2026 SQLite fixes) and
# `sqlite-unlock-notify` keeps the busy-handler behaviour 0.8 built in. The
# extension-loading and deserialize APIs are not enabled: nothing here calls
# them. The lock still lists the optional mysql driver, as any lock does, but
# in 0.9 it pulls rsa only behind its `mysql-rsa` feature, so rsa 0.9
# (RUSTSEC-2023-0071) has left the lock.
sqlx = { version = "0.9", features = ["sqlite-bundled", "sqlite-unlock-notify", "runtime-tokio", "tls-native-tls", "migrate", "macros", "chrono", "uuid"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
config = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["loader"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
bcrypt = "0.15"
rpassword = "7"
# v10 requires exactly one explicit crypto backend; aws_lc_rs is already in
# the dependency tree as rustls 0.23's default provider.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
comfy-table = "7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
dirs = "5"
shellexpand = "3"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
arc-swap = "1"
rand = "0.8"
base64 = "0.22"

# ── Prometheus (--features prometheus) ─────────────────────────────────
prometheus = { version = "0.14", optional = true }

# ── AWS Bedrock (--features bedrock) ───────────────────────────────────
# default-features = false drops the SDK's legacy `rustls` feature (hyper 0.14 +
# rustls 0.21 + rustls-webpki 0.101, GHSA-82j2-j2ch-gfr8 et al.); the modern
# `default-https-client` (hyper 1 + rustls 0.23) is the only TLS stack we keep.
aws-sdk-bedrockruntime = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config             = { version = "1", optional = true }

# ── GCP Vertex (--features vertex) ─────────────────────────────────────
google-cloud-auth = { version = "1", optional = true }

# ── OpenTelemetry (--features otel) ────────────────────────────────────
opentelemetry                  = { version = "0.32", features = ["logs"], optional = true }
opentelemetry_sdk              = { version = "0.32", features = ["logs"], optional = true }
opentelemetry-otlp             = { version = "0.32", features = ["grpc-tonic", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
tracing-opentelemetry          = { version = "0.33", optional = true }
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp"] }
tracing-appender = "0.2"

[dev-dependencies]
toml = "0.8"
axum-test = "14"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
serial_test = "3"
# Generates the mock OIDC issuer's RSA signing key at test time. Already in the
# build graph as jsonwebtoken's crypto backend.
aws-lc-rs = "1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }

[profile.release]
# Pinned ahead of the routing plugin runtime (design spec §4c): plugins will run
# on the blocking pool with panics surfaced as `JoinError`, which only works
# while panics unwind. Switching to `panic = "abort"` would silently delete that
# guarantee before it is ever built. Do not change without reading §4c.
# `unwind` is already the release default, so this pin is behaviourally inert.
panic = "unwind"

[patch.crates-io]
# sqlx-sqlite 0.9.0 as published, with its libsqlite3-sys range widened to
# <0.40.0 so the lock can take 0.39.x (SQLite 3.54, CVE-2026-119375 fixed).
# See patches/sqlx-sqlite/README.md; delete once sqlx 0.9.1 or later ships the range.
sqlx-sqlite = { path = "patches/sqlx-sqlite" }

[target."cfg(unix)".dependencies]
libc = "0.2"
