{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "modelrouter.fullname" . }}
  labels:
    {{- include "modelrouter.labels" . | nindent 4 }}
  annotations:
    {{- if and (eq .Values.ingress.className "nginx") .Values.ingress.nginxRetry }}
    # Re-send to the next pod only when the connection failed or timed out
    # before the request was sent; POST is never replayed after that.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: {{ .Values.ingress.nginxRetryTries | quote }}
    {{- end }}
    {{- if eq .Values.ingress.className "nginx" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.streamTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.streamTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "modelrouter.fullname" . }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
