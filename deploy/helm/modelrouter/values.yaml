# Number of replicas. Keep at 1 when using SQLite (single-writer constraint).
replicaCount: 1

image:
  repository: ghcr.io/keithmackay/modelrouter
  tag: "latest"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistent storage for SQLite database
persistence:
  enabled: true
  storageClass: ""     # "" uses cluster default
  size: 1Gi
  accessMode: ReadWriteOnce

# Horizontal Pod Autoscaler — disable when using SQLite (single-writer)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# config.toml content rendered into a ConfigMap.
# Sensitive values (api_key, jwt_secret) should be provided via `secrets` below
# and will be injected as environment variables, not embedded in the config file.
config: |
  [server]
  host = "0.0.0.0"
  port = 8080

  [database]
  path = "/data/router.db"

  [routing]
  default_provider = "openai"
  default_model = "gpt-4o"

  [auth]
  jwt_secret = ""  # overridden by MODELROUTER_AUTH__JWT_SECRET env var

# Provider API keys and other secrets injected as environment variables.
# These become env vars of the form MODELROUTER_PROVIDERS__<UPPER>__API_KEY.
secrets:
  jwtSecret: "change-me"
  providers: {}
  # providers:
  #   openai: "sk-..."
  #   anthropic: "sk-ant-..."

# Probe timings. The startup probe absorbs first-start migrations: the
# listener binds only after they finish, so the pod answers nothing for that
# long and the kubelet must wait periodSeconds * failureThreshold before it
# restarts the container. Readiness polls /health/ready (store reachable,
# schema at head, provider adapters built, not draining); liveness polls
# /health/live, which does no I/O.
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Ceiling on the drain after SIGTERM. The router exits as soon as no request
# is in flight; this only matters while a long stream is still running. Keep
# it at or above [server] shutdown_grace_secs in `config` (default: the
# longest tier timeout, 6 hours).
terminationGracePeriodSeconds: 21630

# Cross-replica state. "memory" divides the in-memory limits by replicaCount;
# "redis" shares them (and session pins and pending admin logins) through
# one Redis. redisUrl may be left empty when the response cache already
# names one under [cache] in `config`.
cluster:
  backend: memory
  redisUrl: ""

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Rolling update: bring one new pod up and Ready before any old pod stops.
# With replicaCount 1 this is still what makes an upgrade zero-downtime.
rollout:
  maxSurge: 1
  maxUnavailable: 0

# Keep at least this many pods serving through voluntary disruptions (node
# drains, cluster upgrades). Set minAvailable to "" to use maxUnavailable.
# Enable only with replicaCount >= 2, otherwise a drain can never proceed.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Spread replicas across zones and nodes so losing one costs at most the
# requests in flight on it. Enable with replicaCount >= 2.
topologySpread:
  enabled: false
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname
