# Number of replicas. Keep at 1 when using SQLite (single-writer constraint).
replicaCount: 1

image:
  repository: ghcr.io/keithmackay/modelrouter
  tag: "latest"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistent storage for SQLite database
persistence:
  enabled: true
  storageClass: ""     # "" uses cluster default
  size: 1Gi
  accessMode: ReadWriteOnce

# Horizontal Pod Autoscaler. Needs the replicated setup: PostgreSQL
# (`database.postgresUrl` or `database.existingSecret`, with
# `persistence.enabled: false`) and `cluster.backend: redis`. The chart
# refuses to render autoscaling without them, because SQLite is single-writer
# and the in-memory limits are split by a replica count the HPA keeps changing.
# With autoscaling on, the Deployment leaves `replicas` to the HPA and the
# router sizes its Redis-down fallback share by `maxReplicas`.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  # Requests in flight per pod (streams count until their last byte), read
  # from the modelrouter_requests_in_flight gauge on /metrics. The best
  # signal for an I/O-bound proxy, but it needs a custom-metrics adapter
  # (prometheus-adapter, KEDA, a cloud adapter) serving that metric for pods.
  # Empty leaves it out.
  targetInFlightPerPod: ""
  # CPU is a fallback signal; a pod busy with long streams can sit at low CPU.
  targetCPUUtilizationPercentage: 70
  # Memory tracks load poorly for a proxy and is off by default.
  targetMemoryUtilizationPercentage: ""
  # Scale up fast, scale down slowly: a removed pod drains its streams, so
  # flapping costs capacity for the length of the longest stream.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

# PostgreSQL store for two or more replicas. Set postgresUrl (kept in the
# chart Secret) or name an existingSecret holding it; either is injected as
# MODELROUTER_DATABASE__POSTGRES_URL into the migrate init container and the
# router. Use an image built with the postgres feature (tag suffix -postgres).
database:
  postgresUrl: ""
  existingSecret: ""
  existingSecretKey: postgres-url

# Scrape annotations on the pods (prometheus.io/scrape, port, path) so a
# Prometheus that honours them picks up /metrics, including the in-flight
# gauge the autoscaler can use.
metrics:
  podAnnotations: true

# config.toml content rendered into a ConfigMap.
# Sensitive values (api_key, jwt_secret) should be provided via `secrets` below
# and will be injected as environment variables, not embedded in the config file.
config: |
  [server]
  host = "0.0.0.0"
  port = 8080

  [database]
  path = "/data/router.db"

  [routing]
  default_provider = "openai"
  default_model = "gpt-4o"

  [auth]
  jwt_secret = ""  # overridden by MODELROUTER_AUTH__JWT_SECRET env var

# Provider API keys and other secrets injected as environment variables.
# These become env vars of the form MODELROUTER_PROVIDERS__<UPPER>__API_KEY.
secrets:
  jwtSecret: "change-me"
  providers: {}
  # providers:
  #   openai: "sk-..."
  #   anthropic: "sk-ant-..."

# Probe timings. The startup probe absorbs first-start migrations: the
# listener binds only after they finish, so the pod answers nothing for that
# long and the kubelet must wait periodSeconds * failureThreshold before it
# restarts the container. Readiness polls /health/ready (store reachable,
# schema at head, provider adapters built, not draining); liveness polls
# /health/live, which does no I/O.
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# Ceiling on the drain after SIGTERM. The router exits as soon as no request
# is in flight; this only matters while a long stream is still running. Keep
# it at or above [server] shutdown_grace_secs in `config` (default: the
# longest tier timeout, 6 hours).
terminationGracePeriodSeconds: 21630

# After SIGTERM, keep admitting requests this long while /health/ready
# already answers 503, so the Service and ingress drop the pod before it
# starts refusing. Kubernetes propagates a terminating pod's endpoint removal
# asynchronously (a few seconds); refusing at once turns that window into
# 503s on every rollout and scale-down. Becomes [server] drain_delay_secs.
drainDelaySeconds: 10

# Cross-replica state. "memory" divides the in-memory limits by replicaCount;
# "redis" shares them (and session pins and pending admin logins) through
# one Redis. redisUrl may be left empty when the response cache already
# names one under [cache] in `config`.
cluster:
  backend: memory
  redisUrl: ""

# Optional Ingress. With ingress-nginx (className nginx) and nginxRetry, a
# request whose connection to a pod failed before it was sent (the pod just
# died, or its endpoint is stale) is sent to another pod instead of failing.
# nginx never re-sends a POST that already reached a pod, so no request runs
# twice; a stream cut mid-way still fails and is the caller's to retry.
# Timeouts are raised for long streams and buffering is off for SSE.
ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  tls: []
  #  - secretName: modelrouter-tls
  #    hosts: [modelrouter.example.com]
  annotations: {}
  nginxRetry: true
  nginxRetryTries: 3
  streamTimeoutSeconds: 21600

nodeSelector: {}
tolerations: []
affinity: {}

# Rolling update: bring one new pod up and Ready before any old pod stops.
# With replicaCount 1 this is still what makes an upgrade zero-downtime.
rollout:
  maxSurge: 1
  maxUnavailable: 0

# Keep at least this many pods serving through voluntary disruptions (node
# drains, cluster upgrades). Set minAvailable to "" to use maxUnavailable.
# Enable only with replicaCount >= 2, otherwise a drain can never proceed.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Spread replicas across zones and nodes so losing one costs at most the
# requests in flight on it. Enable with replicaCount >= 2.
topologySpread:
  enabled: false
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname
