apiVersion: v1
kind: Namespace
metadata: {name: mr-crash}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: mr-crash}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: modelrouter}
            - {name: POSTGRES_PASSWORD, value: modelrouter}
            - {name: POSTGRES_DB, value: modelrouter}
          args: ["-c", "max_connections=300"]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "modelrouter"]}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mr-crash}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: mr-crash}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - {name: redis, image: "redis:7", ports: [{containerPort: 6379}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: mr-crash}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: stub, namespace: mr-crash}
spec:
  replicas: 1
  selector: {matchLabels: {app: stub}}
  template:
    metadata: {labels: {app: stub}}
    spec:
      containers:
        - name: stub
          image: python:3.12-slim
          command: ["python3", "/app/stub_upstream.py", "8000"]
          env:
            - {name: STUB_HOST, value: "0.0.0.0"}
            - {name: STUB_DELAY_SECS, value: "0.3"}
            - {name: STUB_STREAM_SECS, value: "3"}
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: crash-scripts}}]
---
apiVersion: v1
kind: Service
metadata: {name: stub, namespace: mr-crash}
spec: {selector: {app: stub}, ports: [{port: 8000}]}
