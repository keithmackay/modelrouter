apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mr
  namespace: mr-crash
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mr-crash-retry@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: mr-modelrouter, port: {name: http}}}
