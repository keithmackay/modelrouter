# modelrouter — example configuration
# Copy to ~/.modelrouter/config.toml and edit as needed.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
[server]
# Address to bind. Use 0.0.0.0 to accept connections from all interfaces.
host = "127.0.0.1"
port = 8080
# Maximum request body size in megabytes.
request_body_limit_mb = 10

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[database]
# Path to the SQLite database file. ~ is expanded automatically.
path = "~/.modelrouter/router.db"
# Uncomment to use PostgreSQL instead of SQLite (requires --features postgres).
# postgres_url = "postgres://user:pass@localhost:5432/modelrouter"

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
[routing]
# Provider used when no prefix is present in the model name.
default_provider = "openai"
# Model used when the client does not specify one.
default_model = "gpt-4o"

# Aliases map a short name → full provider/model string.
[routing.model_aliases]
"fast"    = "openai/gpt-4o-mini"
"smart"   = "anthropic/claude-opus-4-5"
"local"   = "ollama/llama3"

# Fallback chains: if a chat/completion model provider fails, try the next one.
# Provider errors (5xx, 429, timeouts, connection failures) walk the chain.
# Client errors (400, 404, etc) surface immediately without failover.
[routing.fallback_chains]
"openai/gpt-4o" = ["anthropic/claude-opus-4-5", "ollama/llama3"]

# Search fallback chains: same provider-error semantics as fallback_chains.
# The serving engine is recorded in the cost ledger (and in cache hits), so
# cost attribution reflects the engine that actually served the request.
[routing.search_fallback_chains]
"tavily" = ["vertex"]

# Per-tier timeout ceilings (seconds), applied when a request addresses one
# of these three names directly as its model (`request_model`) — e.g. a
# caller using `[routing.model_aliases]` tiers like "fast"/"balanced"/"deep"
# above. A request that names a literal `provider/model` or an untiered
# alias instead falls back to that provider's own `timeout_secs` below,
# unaffected by this table. Values shown are the doctrine defaults; every
# field is independently optional and falls back to its own default.
[tier_timeouts]
fast     = 120   # 2 minutes
balanced = 600   # 10 minutes
deep     = 1800  # 30 minutes

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
# `timeout_secs` below is each provider's FLAT fallback — the ceiling used
# when a request's `request_model` doesn't match a `[tier_timeouts]` name
# (see above). It defaults to 1800s (was 60s) so a newly-added provider
# without an explicit value here is never silently killed before it can
# answer; set it explicitly for a provider that genuinely needs a shorter
# per-call bound.
[providers.openai]
api_key  = ""          # or set MODELROUTER_PROVIDERS__OPENAI__API_KEY
# api_base = "https://api.openai.com/v1"
timeout_secs = 60

[providers.anthropic]
api_key  = ""          # or set MODELROUTER_PROVIDERS__ANTHROPIC__API_KEY
# api_base = "https://api.anthropic.com"
timeout_secs = 60

[providers.gemini]
api_key  = ""          # or set MODELROUTER_PROVIDERS__GEMINI__API_KEY
# api_base = "https://generativelanguage.googleapis.com/v1beta/openai"
timeout_secs = 60

[providers.ollama]
api_key  = "ollama"    # Ollama doesn't require a real key
api_base = "http://localhost:11434/v1"
timeout_secs = 120

# Web search proxying (POST /v1/search). Engines: `tavily`, `vertex`
# (--features vertex) and `bing_grounding` (--features bing-grounding);
# additional engines can be added to src/providers/search_registry.rs and
# configured the same way under [providers.<engine>].
#
# `generic_chat` defaults to true, meaning any [providers.x] section is also
# reachable as a full chat provider via POST /v1/chat/completions with
# model="x/<anything>". A provider configured only to back a dedicated route
# like this one should set `generic_chat = false` so it stays reachable
# solely through that route's own gating (#97).
# [providers.tavily]
# api_key  = ""          # or set MODELROUTER_PROVIDERS__TAVILY__API_KEY
# api_base = "https://api.tavily.com"
# timeout_secs = 30
# generic_chat = false

# Grounding with Bing Search on Azure AI Foundry (requires build with
# `--features bing-grounding`, which is on by default).
#
# There is no bare Bing search REST API any more — the classic Bing Web Search
# API is retired. Grounding with Bing Search is a Foundry TOOL: provision a
# "Grounding with Bing Search" resource, connect it to a Foundry project, and
# the router calls the project's Responses API with the tool attached. So the
# call embeds a model generation, which is why `timeout_secs` is 300 here and
# not 30 — this behaves like a completion, not like a search API. The router
# warns at startup if you set it below 300.
#
# Authentication is Microsoft Entra, from the ENVIRONMENT, never from this file:
#   * AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET (app registration), or
#   * managed identity via IMDS (nothing to set; the default when the trio is absent).
# Grant the identity the "Azure AI User" role on the Foundry project. Setting
# `api_key` here switches to resource-key auth — supported, but it puts a secret
# on disk; Entra is the intended mode.
#
# LEGAL: results from this engine are governed by Microsoft's Grounding with
# Bing Search Use and Display Requirements
# (https://www.microsoft.com/bing/apis/grounding-legal). Website URLs and the
# Bing search query URL must be retained and displayed in the exact form
# Microsoft returned them. The adapter therefore returns citation URLs VERBATIM
# — no unescaping, no tracking-parameter stripping, no redirect unwrapping — and
# anything rendering /v1/search output carries the display obligation. Bing
# grounding is also billed per query transaction, and query text leaves the
# Azure compliance boundary.
#
# [providers.bing_grounding]
# foundry_project_endpoint = "https://<resource>.services.ai.azure.com/api/projects/<project>"
# project_connection_id    = "/subscriptions/.../connections/<bing-connection>"
# search_model             = "<model-deployment-name>"  # required; no default
# timeout_secs             = 300
# api_version              = ""          # omit: the /openai/v1/ surface is version-less
# custom_search            = false       # true = Bing Custom Search (preview), domain-restricted
# custom_search_instance   = ""          # required when custom_search = true

# GCP Vertex AI (requires build with `--features vertex`).
# Supports Gemini (publisher "google") and Claude-on-Vertex (publisher "anthropic").
# Authentication uses Application Default Credentials by default; point
# `credentials_path` at a service-account JSON to override.
# [providers.vertex]
# project          = "my-gcp-project"
# region           = "us-east5"               # region must host the models you plan to call
# credentials_path = "/secrets/sa.json"       # omit to use ADC (gcloud / metadata server)
# timeout_secs     = 120
#
# Example aliases — Claude-on-Vertex models require versioned IDs (@YYYYMMDD).
# Confirm current IDs in the GCP Console before pinning.
# [routing.model_aliases]
# "gemini-2.5-pro"     = "vertex/google/gemini-2.5-pro"
# "gemini-2.5-flash"   = "vertex/google/gemini-2.5-flash"
# "claude-sonnet-4-6"  = "vertex/anthropic/claude-sonnet-4-6@20250514"
# "claude-opus-4-5"    = "vertex/anthropic/claude-opus-4-5@20250101"

# Azure AI Foundry model inference (requires build with `--features foundry`,
# which is on by default). What `[providers.vertex]` is for GCP, this is for
# Azure: one endpoint fronting every model deployed on the resource — Llama,
# Mistral, Phi, DeepSeek, Cohere, Grok and the OpenAI models — selected by the
# deployment name in the request. Chat, streaming, embeddings and model
# discovery all go through it.
#
# NOT the same as `[providers.azure]`, which speaks the older Azure OpenAI
# surface (`/openai/deployments/<deployment>/...?api-version=`) with an
# `api-key` header and needs one provider entry per deployment. Keep using that
# one for an Azure OpenAI resource; use this one for a Foundry / AI Services
# resource.
#
# Which surface you get is the path you configure:
#   * bare host              -> the OpenAI-compatible surface, `/openai/v1`,
#                               no api-version (the service defaults to `v1`)
#   * a path ending /models  -> the Azure AI Model Inference surface, which
#                               REQUIRES an api-version (sent for you)
# The Model Inference API is documented as deprecated in favour of the
# OpenAI-compatible one, which is why a bare host resolves to the latter.
#
# Authentication is Microsoft Entra, from the ENVIRONMENT, never from this file:
#   * AZURE_TENANT_ID + AZURE_CLIENT_ID + AZURE_CLIENT_SECRET (app registration), or
#   * managed identity via IMDS (nothing to set; the default when the trio is absent).
# Grant the identity the "Azure AI User" role (or equivalent) on the resource.
# Setting `api_key` here switches to resource-key auth — supported, but it puts
# a secret on disk; Entra is the intended mode.
#
# [providers.foundry]
# foundry_endpoint = "https://<resource>.services.ai.azure.com"
# project          = ""       # optional: appends /api/projects/<project>
# entra_scope      = ""       # optional audience override; see below
# api_version      = ""       # optional; overrides the per-surface default
# timeout_secs     = 120
#
# `entra_scope`: the audience is derived from the endpoint — project endpoints
# take https://ai.azure.com/.default, resource endpoints take
# https://cognitiveservices.azure.com/.default per the published OpenAPI
# documents. Microsoft's keyless-auth how-to shows ai.azure.com for resource
# endpoints too, so where spec and prose disagree this field is the override.
# The resolved value is logged at startup and named in any 401/403.
#
# Aliases map to `foundry/<deployment-name>` — the names `GET /v1/models`
# lists for this provider are exactly what goes after the slash.
# [routing.model_aliases]
# "llama-70b"  = "foundry/Llama-3.3-70B-Instruct"
# "phi-4"      = "foundry/Phi-4"

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
[auth]
# Secret used to sign JWT tokens for key rotation. Change before deploying!
jwt_secret            = "change-me-jwt-secret"
# How long a JWT token is valid (minutes).
jwt_expiry_mins       = 60
# Grace period during key rotation where both old and new keys are accepted.
rotation_overlap_mins = 15

# ---------------------------------------------------------------------------
# Admin Bootstrap
# ---------------------------------------------------------------------------
# Automatically create an admin account at startup if it does not exist.
# Idempotent: second startup is a no-op (password and role are never rotated).
# Generate the password_hash with: modelrouter admin hash-password
# [admin.bootstrap]
# name = "bootstrap-admin"
# role = "superadmin"        # Valid roles: superadmin, admin, viewer
# password_hash = "$2b$12$..."  # NEVER use plaintext

# ---------------------------------------------------------------------------
# Hooks — lifecycle
# Lifecycle hooks run at server startup/shutdown.
# ---------------------------------------------------------------------------
[[hooks.lifecycle]]
name        = "notify-start"
event       = "server.start"
exec        = "/usr/local/bin/my-notify.sh"
timeout_secs = 5

# ---------------------------------------------------------------------------
# Hooks — pipeline
# Pipeline hooks intercept every request/response.
# ---------------------------------------------------------------------------
[[hooks.pipeline]]
name         = "pii-scrubber"
event        = "request.pre"
exec         = "/usr/local/bin/pii-scrub"
capabilities = ["mutate_request"]
timeout_secs = 3
fail_open    = false   # If true, proxy continues even if the hook fails.

[[hooks.pipeline]]
name         = "usage-logger"
event        = "response.post"
exec         = "/usr/local/bin/log-usage"
capabilities = []
timeout_secs = 2
fail_open    = true

# ── Telemetry (requires --features otel) ──────────────────────────────
# [telemetry]
# enabled = false
# endpoint = "http://localhost:4317"   # OTLP gRPC endpoint (collector)
# service_name = "modelrouter"
# sample_ratio = 0.1                   # 0.0–1.0 fraction of normal requests to trace
# slow_threshold_ms = 2000             # always export spans slower than this
# batch_queue_size = 2048
# batch_scheduled_delay_ms = 5000
# batch_max_export_size = 512

# ── Pricing overrides ────────────────────────────────────────────────────
# Override per-model pricing (dollars per million tokens).
# Any model not listed here falls back to built-in defaults.
#
# [[pricing]]
# model = "gpt-4o"
# input_per_million = 2.50
# output_per_million = 10.0
#
# [[pricing]]
# model = "my-private-llama"
# input_per_million = 0.10
# output_per_million = 0.30
#
# Search pricing is a flat rate, not a per-token rate: for a "search/{engine}"
# entry, `input_per_million` is read as dollars PER QUERY (one row is always
# one query), mirroring how image pricing reuses the same field as
# dollars-per-image (see [[pricing]] "dall-e-3/standard" precedent in code).
# `output_per_million` is unused for search and should be left at 0.0.
# Falls back to a built-in default (~$0.005/query) if no entry matches.
#
# [[pricing]]
# model = "search/tavily"
# input_per_million = 0.005
# output_per_million = 0.0
#
# Grounding with Bing Search is billed per query TRANSACTION (one tool call),
# so it fits the same flat rate. Check the current rate on Microsoft's Bing
# APIs pricing page; the model deployment the tool runs on is billed separately
# by Azure OpenAI and is not captured by this entry.
#
# [[pricing]]
# model = "search/bing_grounding"
# input_per_million = 0.035
# output_per_million = 0.0

# ---------------------------------------------------------------------------
# Model Capabilities
# ---------------------------------------------------------------------------
# Which sampling parameters a model will accept. Providers drop parameters
# between model versions and do so per model, not per provider: Anthropic's
# Claude 5 family rejects `temperature` with
#
#   400 {"type":"invalid_request_error",
#        "message":"`temperature` is deprecated for this model."}
#
# while claude-haiku-4-5, behind the same provider, still honours it. Callers
# address a routing alias and cannot know which they will reach, so the router
# strips parameters the resolved model would reject.
#
# The router ships a built-in table (claude-opus-5, claude-sonnet-5,
# claude-fable-5-1). These entries override it in both directions — declare a
# model the build predates, or re-enable one whose provider restored support —
# so you never need a new release to react to a provider change.
#
# `model` is matched with the provider prefix stripped and case-insensitively,
# the same as [[pricing]]. Unlisted models are assumed to support everything.
#
# [[model_capabilities]]
# model = "claude-opus-6"
# supports_temperature = false

# ---------------------------------------------------------------------------
# Declarative Policy Rules
# ---------------------------------------------------------------------------
# Rules are evaluated before database budget rules. The highest-priority
# matching rule wins. If no rule matches, database rules apply (backward compat).
#
# NOTE: Use [[policy_rules]] (not [[policy.rules]]) — flat top-level array.
#
# Condition fields (all optional — omit to match everyone):
#   tag        = user's API key tag
#   group_name = user's group
#   user_id    = specific user ID
#   model      = exact requested model string
#
# All condition fields provided must match (AND logic).
#
# [[policy_rules]]
# name         = "research-team-opus"
# priority     = 10
# allow_models = ["claude-opus-4-5"]
# budget_usd   = 200.0
# window       = "monthly"         # "daily", "weekly", or "monthly"
# [policy_rules.condition]
# tag = "research"
#
# [[policy_rules]]
# name     = "intern-budget"
# priority = 5
# budget_usd = 10.0
# window   = "monthly"
# [policy_rules.condition]
# group_name = "interns"
#
# [[policy_rules]]
# name     = "global-floor"
# priority = 0
# budget_usd = 50.0
# window   = "monthly"
# # No condition — matches all users (catch-all / default policy)

# ── SSO / OIDC (optional) ─────────────────────────────────────────────────────
# Enable OpenID Connect SSO for admin login.
# When enabled, admins can authenticate at /admin/auth/oidc/login instead of
# (or in addition to) the username/password form.
#
# Tested with: Google, GitHub (using GHES OIDC), Okta, Auth0, Keycloak.
#
# [oidc]
# enabled = false
#
# # OIDC issuer URL — discovery document fetched from {issuer_url}/.well-known/openid-configuration
# issuer_url = "https://accounts.google.com"
#
# # OAuth2 client credentials (create in your IdP console)
# client_id = "your-client-id.apps.googleusercontent.com"
# client_secret = "your-client-secret"
#
# # Redirect URI — must match exactly what you registered in the IdP console
# redirect_uri = "https://your-modelrouter.example.com/admin/auth/oidc/callback"
#
# # Optional: restrict login to specific email addresses
# allowed_emails = ["alice@example.com", "bob@example.com"]
#
# # Optional: restrict login to email domains (checked if email not in allowed_emails)
# allowed_domains = ["example.com", "corp.example.com"]
#
# # Role assigned to auto-provisioned admins (default: "admin"; use "superadmin" for full access)
# auto_provision_role = "admin"

# ── Response cache (optional) ─────────────────────────────────────────────────
# Serves identical eligible requests from a store instead of calling the
# provider. Hits are recorded as usage with cost_usd = 0 and cache_hit = true,
# so the saving shows up next to spend and is never counted as spend.
#
# Exact-match only — no semantic/fuzzy matching.
#
# [cache]
# enabled = false
#
# # Store backend: "memory" (per-process; each replica warms its own copy) or
# # "redis" (shared across stateless replicas).
# backend = "memory"
# redis_url = "redis://127.0.0.1:6379"
#
# # Key prefix, so several environments can share one Redis safely.
# namespace = "modelrouter"
#
# # Bound on the in-memory backend only.
# max_entries = 1000
#
# # Fallback TTL for classes that do not set their own.
# ttl_seconds = 3600
#
# [cache.completions]
# enabled = true
# # Only cache requests whose temperature is at or below this value. The default
# # of 0.0 means "deterministic requests only" — nondeterministic sampling never
# # silently replays a stored answer.
# max_temperature = 0.0
# # Temperature assumed when a request omits it. The OpenAI default is 1.0, so
# # with max_temperature = 0.0 a request that omits temperature is NOT cached.
# assumed_temperature = 1.0
# # Defaults to cache.ttl_seconds when unset.
# ttl_seconds = 3600
#
# [cache.search]
# enabled = true
# # Search results go stale faster than completions.
# ttl_seconds = 900

# ── Deep health (optional) ────────────────────────────────────────────────────
# GET /health/deep proves that LLM, embedding, and search calls THROUGH the
# gateway actually work: one minimal real call per capability along the normal
# routing path (routing rules + provider credentials), recorded in the ledger
# under the "health-probe" user. GET /health stays a cheap liveness check and,
# when caching is enabled, reports the cache backend's live state.
#
# [health]
# # Probes cost real provider money; results are served from memory for this
# # long so aggressive polling cannot burn quota.
# deep_ttl_seconds = 60
# # Model the LLM probe requests (goes through aliases/routing like any
# # caller). Defaults to routing.default_model.
# #llm_probe_model = "balanced"
# # Model the embedding probe requests.
# embedding_probe_model = "text-embedding-3-small"
# # Engine the search probe uses. Unset (the default) infers from
# # [routing] default_search_engine, then from the sole configured search
# # provider when there is exactly one -- set this explicitly only when
# # multiple search engines are configured and the probe should exercise a
# # specific one regardless of which is the traffic default.
# #search_probe_engine = "tavily"
